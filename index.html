<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetterWeather — Das Wetter, wie es sein sollte</title>
  <meta name="description" content="Wettervorhersage für jeden Ort der Welt — immer sonnig, immer angenehm." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header>
      <div class="logo">
        <h1>🌤 BetterWeather</h1>
        <p>Das Wetter, wie es sein sollte.</p>
      </div>
      <button id="theme-toggle" aria-label="Dark Mode umschalten">🌙</button>
    </header>

    <!-- Search -->
    <div class="search-wrapper">
      <div class="search-bar">
        <input
          id="search-input"
          type="text"
          placeholder="Stadt suchen…"
          autocomplete="off"
          aria-label="Stadt suchen"
        />
        <button id="search-btn"><span>Suchen</span></button>
      </div>
      <ul id="suggestions" hidden></ul>
    </div>

    <!-- Loading -->
    <div id="loading-box">
      <div class="spinner"></div>
      Wetterdaten werden geladen…
    </div>

    <!-- Error -->
    <div id="error-box" hidden></div>

    <!-- Main content -->
    <div id="main-content" hidden>

      <p id="city-title"></p>

      <!-- Current weather -->
      <div class="current-card glass-card">
        <div class="current-main">
          <span id="cur-icon"></span>
          <div class="current-temps">
            <div id="cur-temp"></div>
            <div id="cur-feels"></div>
            <div id="cur-desc"></div>
          </div>
        </div>
        <div class="current-details">
          <div class="detail-item">
            <div class="detail-label">Wind</div>
            <div class="detail-value" id="cur-wind"></div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Luftfeuchte</div>
            <div class="detail-value" id="cur-humidity"></div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Luftdruck</div>
            <div class="detail-value" id="cur-pressure"></div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Regen</div>
            <div class="detail-value" id="cur-precip"></div>
          </div>
        </div>
      </div>

      <!-- Hourly -->
      <div class="hourly-section">
        <p class="section-title">Stündliche Vorhersage</p>
        <div id="hourly-list"></div>
      </div>

      <!-- Daily -->
      <div class="daily-section">
        <p class="section-title">7-Tage-Vorhersage</p>
        <div id="daily-list"></div>
      </div>

    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
